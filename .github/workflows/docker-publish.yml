name: Build and push Docker images

## Run every time a change is pushed to the identified branch,
## or when a pull request is made to the branch;
## Also (re-)run on schedule.
on:
  schedule:
    ## build/rebuild on 1st/15th day of month at 09:40
    ## NOTE: GitHub disables scheduled builds if no repo activity for 60 days;
    ##       to re-enable, edit the cron schedule values.
    - cron: '40 9 1,15 * *'
  ## FOR-CAST integration branch: publish only on push to this branch. The schedule above
  ## runs from the default branch's copy of this file, so it never builds this branch.
  push:
    branches: [ "forcast/harvest-stack" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      ## Cap concurrent legs. Every leg ends by pushing a multi-hundred-MB image to GHCR, and
      ## running all of them at once trips GitHub's secondary rate limit, which surfaces as a
      ## push failure reading `denied: permission_denied ... 403 Forbidden` -- the body, not the
      ## prefix, is where it says "You have exceeded a secondary rate limit". That reads as a
      ## credentials problem and is not one, which makes it expensive to diagnose. Observed on a
      ## fork build of 2026-08-18. Builds still run in parallel, just fewer at a time.
      max-parallel: 3
      matrix:
        include:
          ## FOR-CAST integration branch: the UCLv2 image on Ubuntu 24.04 only.
          - dockercontext: .
            dockerfile: ./Docker-LANDIS-II-v8-UCL2-release/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/landis-ii-v8-uclv2-release
            ubuntu_version: "24.04"
            build_ubuntu_arg: "true"

    ## Set the permissions granted to the `GITHUB_TOKEN` for the actions in this job
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      ## Login against a Docker registry except on PR
      ## https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ## Extract metadata (tags, labels) for Docker
      ## https://github.com/docker/metadata-action
      ##
      ## Tag scheme:
      ##   :ubuntu-<version>  — pinnable OS-specific tag (all entries)
      ##   :ubuntu-latest     — most recent Ubuntu LTS build (is_latest entries only)
      ##   :latest            — alias for :ubuntu-latest (is_latest entries only)
      ##   :main              — alias for :ubuntu-latest, kept for backwards compatibility (is_latest entries only)
      ##
      ## For images with multiple Ubuntu versions (v8-release, v8-UCL2-release), :ubuntu-latest/:latest/:main
      ## are only pushed by the is_latest entry to avoid a race condition between parallel CI jobs.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ matrix.image }}
          ## FOR-CAST integration branch: harvest-prefixed tags only, so this never replaces
          ## the :ubuntu-<version> / :latest images that `main` publishes.
          tags: |
            type=raw,value=harvest-ubuntu-${{ matrix.ubuntu_version }}
            type=sha,prefix=harvest-ubuntu-${{ matrix.ubuntu_version }}-

      ## Build and push Docker image with Buildx (don't push on PR)
      ## https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: ${{ matrix.dockercontext }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_ubuntu_arg == 'true' && format('UBUNTU_VERSION={0}', matrix.ubuntu_version) || '' }}

      ## Generates an artifact attestation for image build provenance
      ## https://github.com/actions/attest-build-provenance
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

